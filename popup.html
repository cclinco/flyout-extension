<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0;
      width: 300px;
      font-family: system-ui, sans-serif;
      color: #111;
    }

    .container {
      padding: 14px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #d1d5db;
      border-radius: 22px;
      transition: 0.2s;
    }

    .slider::before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider {
      background-color: #2563eb;
    }

    input:checked + .slider::before {
      transform: translateX(18px);
    }

    #statusText {
      margin: 8px 0 0;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.4;
    }

    hr {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 14px 0;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    .flyout-list {
      max-height: 220px;
      overflow-y: auto;
      margin-bottom: 4px;
    }

    .flyout-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
      border-bottom: 1px solid #f3f4f6;
    }

    .flyout-row input[type="checkbox"] {
      flex-shrink: 0;
      cursor: pointer;
    }

    .flyout-row input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 5px 7px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 13px;
    }

    .flyout-row button {
      border: 1px solid #fecaca;
      background: #f9fafb;
      color: #b91c1c;
      border-radius: 4px;
      padding: 4px 7px;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .flyout-row button:hover {
      background: #fef2f2;
    }

    .empty-msg {
      font-size: 12px;
      color: #9ca3af;
      padding: 8px 0;
    }

    .add-row {
      display: flex;
      gap: 6px;
      padding-top: 8px;
    }

    .add-row input[type="text"] {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 13px;
    }

    .add-row button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row">
      <span class="title">Flyout Agenda</span>
      <label class="switch">
        <input type="checkbox" id="enableToggle" />
        <span class="slider"></span>
      </label>
    </div>
    <p id="statusText">Loading…</p>

    <hr />

    <div class="section-title">Flyouts</div>
    <div class="flyout-list" id="flyoutList"></div>
    <div class="add-row">
      <input type="text" id="newFlyoutName" placeholder="New flyout name" />
      <button id="addFlyoutBtn">Add</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
